version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases settle before adopting them
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript majors arrive with a blueprint major release, which updates the lint presets to match.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node's type definitions follow the Node major in .nvmrc, not the newest release.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
