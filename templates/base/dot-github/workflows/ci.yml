# Runs blueprint's shared checks; the required check is `ci / ci-ok`.
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: stavkamil/blueprint/.github/workflows/reusable-checks.yml@v{{blueprintMajor}}
    permissions: { contents: read, pull-requests: read }
