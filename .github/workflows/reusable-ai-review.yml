# Shared AI code review for blueprint projects. The caller runs it when a PR is opened or marked ready (re-run the
# workflow to review again) and passes the Claude token by name. The review never runs project code: no install,
# no scripts; it reads the diff and the files, and posts comments through the Claude GitHub App.
name: reusable-ai-review

on:
  workflow_call:
    inputs:
      model:
        description: Claude model for the review; empty uses Claude Code's default
        type: string
        default: ""
      max-turns:
        description: Upper bound on agent turns, to stay inside Pro usage limits
        type: number
        default: 30
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions: {}

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read # read the code under review
      pull-requests: read # read the PR and its diff
      issues: read # read existing PR comments, so findings aren't repeated
      id-token: write # exchange for the Claude GitHub App token that posts the review
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false
          fetch-depth: 1
      - name: Review with Claude
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: >-
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
